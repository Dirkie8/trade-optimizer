account:
  starting_balance: 100
  risk_per_trade: 0.05
  spread_pips: 0.2
  commission_per_trade: 0.0
  leverage: 100
  # New: maximum number of concurrent open positions allowed in backtests/optimization.
  # If set to 1 (default) behavior is unchanged (single position at a time).
  # If >1 the backtester will allow multiple trades to be opened and managed independently.
  max_concurrent_positions: 1
  max_drawdown_stop_pct: 0   # stop trading after 30% drawdown
  slippage_pips: 0.1          # 0.1 pips unfavorable slippage per fill
  min_stop_pips: 0            # ignore SLs tighter than 3 pips
  min_size: 0.01               # skip trades smaller than this size (enforce minimum lot 0.01)
  lot_step: 0.01               # round position size down to nearest 0.01 lot increment
  max_lot_size: 1.00           # hard cap on position size (after leverage & rounding); set 0 or omit to disable
  contract_size: 100000        # units per 1.0 lot (forex standard)
  pip_value_per_lot: 10.0      # USD value per pip for 1 lot on EURUSD-like pairs (override as needed)
  equity_rounding: 0.01        # round equity to the nearest cent for realism
  # Entry cooldown controls (optional; default off)
  no_same_bar_reentry: false   # if true, block opening a new trade on the same bar an exit occurred
  cooldown_bars_after_exit: 0  # number of full bars to wait after an exit before next entry

broker:
  name: exness_demo
  account_id: "1234567"
  api_key: "YOUR_API_KEY_PLACEHOLDER"

# Data file is constructed using candle_data_list_{default_symbol}_{default_timeframe converted to seconds}s.json
general:
  default_symbol: "frxEURUSD"
  default_timeframe: "5m"
  # Validation ratio for Bayesian optimization (e.g., 0.2 = hold out last 20% for final validation)
  # This is used as the default if not specified in the batch optimization script
  validation_ratio: 0.2
