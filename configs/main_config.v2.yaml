# v2 main configuration (aligned for optimizer/evaluator/bot)

general:
  default_symbol: EURUSD
  default_timeframe: 5m  # used for data loading and WF folding cadence

# Data loader settings (extend as needed)
data:
  source: local
  # optional: start/end date, file paths, etc.
  # start: 2023-01-01
  # end: 2025-01-01

# Account/backtest economics used consistently by optimizer and evaluator
account:
  starting_balance: 100.0
  commission_per_lot: 0.0
  slippage_pips: 0.1
  leverage: 100
  lot_step: 0.01
  min_size: 0.01

optimization:
  n_folds: 5
  validation_ratio: 0.2
  seed: 42
  # Reward aggregation across folds: mean | median | mean_var_penalty
  fold_aggregation: mean_var_penalty
  variance_penalty_lambda: 0.25

reward:
  # equity_reward parameters
  k: 5.0
  eps: 1e-12
  # hard constraints
  max_dd_frac_of_start: 0.8  # reject if max DD exceeds 20% of start equity
