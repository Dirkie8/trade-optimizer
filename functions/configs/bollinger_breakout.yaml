strategy:
  class: "BollingerBreakout"
  module: "functions.strategies.bollinger_breakout"
  results_dir: "BollingerBreakout"

name: "Bollinger Band Breakout Strategy"

parameters:
  bb_period: [15, 20, 25, 30]              # Moving average period
  bb_std_dev: [1.5, 2.0, 2.5, 3.0]         # Standard deviation multiplier
  take_profit_pips: [15, 20, 30, 40, 50]   # Take profit levels
  stop_loss_pips: [10, 15, 20, 25, 30]     # Stop loss levels
